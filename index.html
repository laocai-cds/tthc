<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="professional-theme.css">
  <meta name="description" content="Theo dõi tiến độ thực hiện">
  <title>Quản lý tiến độ thực hiện</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f4f7fb;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1e2d3d;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; }
    .app {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(180deg, #f6f9fd 0%, #f3f7fb 100%);
    }
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #1d2f4a 0%, #1b2c42 100%);
      color: #edf3ff;
      padding: 18px 14px 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      margin-bottom: 12px;
    }
    .crest {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7d97f, #dca62b);
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #163456;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }
    .brand b {
      display: block;
      font-size: 14px;
      line-height: 1.3;
    }
    .brand small {
      display: block;
      color: #f0d38c;
      font-size: 11px;
      margin-top: 2px;
    }
    .nav-label {
      color: #a5b8d2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      padding: 18px 8px 8px;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #eaf2ff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .2s ease, transform .2s ease;
    }
    .nav button:hover { background: rgba(255,255,255,0.05); }
    .nav button.active {
      background: rgba(255,255,255,0.08);
      box-shadow: inset 3px 0 0 #f2ca63;
    }
    .nav button .ico {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.08);
      font-size: 15px;
    }
    .nav button .count {
      margin-left: auto;
      min-width: 36px;
      padding: 3px 8px;
      text-align: center;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      font-size: 10px;
      font-weight: 700;
    }
    .sidebar-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .sidebar-foot .chat-launch {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #c51620, #d93a28);
      color: #fff;
      font-weight: 700;
      padding: 11px 12px;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .topbar {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid #e6edf5;
    }
    .crumb {
      color: #5f6f85;
      font-size: 12px;
    }
    .crumb b {
      color: #1e2d3d;
    }
    .topbar-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f3f7fd;
      border: 1px solid #e3ebf6;
      color: #2d4a6d;
      font-size: 12px;
      font-weight: 600;
    }
    .content {
      padding: 22px 32px 28px;
    }
    .heading {
      background: #fff;
      border: 1px solid #e7edf5;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
    }
    .eyebrow {
      display: inline-block;
      background: #edf3fb;
      color: #2d4a6d;
      border: 1px solid #dfeaf7;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }
    .subtitle {
      color: #5f6f85;
      font-size: 12px;
    }
    .cards {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: #fff;
      border: 1px solid #e7edf5;
      border-radius: 12px;
      padding: 16px 16px 14px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(15, 23, 42, 0.07);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #5f6f85;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .card-symbol {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #edf3fb;
      color: #2d4a6d;
      font-weight: 700;
    }
    .card-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #2d4a6d;
      margin: 0 0 6px;
    }
    .card-foot {
      color: #5f6f85;
      font-size: 10px;
    }
    .middle {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e7edf5;
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      padding: 16px;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 14px;
    }
    .progress-list {
      display: grid;
      gap: 12px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.2fr) minmax(80px, 2fr) 52px;
      gap: 10px;
      align-items: center;
    }
    .bar-name {
      color: #2d4a6d;
      font-weight: 600;
      font-size: 12px;
    }
    .bar-track {
      height: 8px;
      background: #edf2f8;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #3d5f8d 0%, #7ea9d6 100%);
      width: 0;
      transition: width .35s ease;
    }
    .bar-val {
      text-align: right;
      color: #2d4a6d;
      font-size: 11px;
      font-weight: 700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .mini {
      background: #f8fafc;
      border: 1px solid #e7edf5;
      border-radius: 10px;
      padding: 12px;
    }
    .mini .k {
      color: #5f6f85;
      font-size: 10px;
      margin-bottom: 8px;
    }
    .mini .v {
      font-size: 24px;
      font-weight: 800;
      color: #2d4a6d;
      line-height: 1;
    }
    .table-panel {
      margin-top: 18px;
      background: #fff;
      border: 1px solid #e7edf5;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      background: #f6f9fc;
      color: #5f6f85;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 14px;
      border-bottom: 1px solid #e7edf5;
    }
    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef3f8;
      color: #2d4a6d;
      font-size: 12px;
    }
    tbody tr:hover {
      background: #f9fbff;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .pill.good { background: #e9f7f1; color: #1d7b5b; }
    .pill.warn { background: #fff6e7; color: #8a6510; }
    .pill.gray { background: #eef2f7; color: #5b6b7d; }
    @media (max-width: 980px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .middle { grid-template-columns: 1fr; }
      .sidebar { width: 220px; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .sidebar { width: 100%; }
      .cards { grid-template-columns: 1fr; }
      .content { padding: 16px; }
      .topbar { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="crest">◉</div>
        <div>
          <b>ĐVC Lao Cai</b>
          <small>Theo dõi tiến độ</small>
        </div>
      </div>

      <div class="nav-label">Tổng quan</div>
      <div class="nav" id="nav"></div>

      <div class="sidebar-foot">
        <button class="chat-launch" id="chatBtn">Hỏi AI</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">Báo cáo <span style="padding:0 7px;color:#c0c9d4">/</span><b id="crumbName">Tổng quan</b></div>
        <div class="topbar-tools">
          <span class="chip" id="dateChip">--</span>
          <span class="chip" id="timeChip">--</span>
        </div>
      </header>

      <div class="content">
        <div class="heading">
          <div class="eyebrow">Báo cáo tiến độ thực hiện</div>
          <h1 id="pageTitle">Tổng hợp 04 thủ tục hành chính</h1>
          <div class="subtitle" id="subtitleText">Tình hình thực hiện so với kế hoạch đầu năm</div>
        </div>

        <section class="cards" id="cards"></section>

        <section class="middle">
          <div class="panel">
            <div class="panel-head">
              <h2>Tiến độ theo thủ tục</h2>
              <span class="chip" id="procedureCount">103 đơn vị</span>
            </div>
            <div class="progress-list" id="progressList"></div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2>Thống kê nhanh</h2>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
          </div>
        </section>

        <div class="table-panel">
          <table>
            <thead>
              <tr>
                <th>Đơn vị</th>
                <th>Thủ tục</th>
                <th>Tiến độ</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const navItems = [
      { id: 'overview', label: 'Tổng quan', count: 10, active: true },
      { id: 'procedure', label: 'Thủ tục hành chính', count: 4 },
      { id: 'profile', label: 'Hồ sơ', count: 114 }
    ];

    const cardsData = [
      { title: 'Tiến độ bình quân', value: '9,5%', note: 'Trên 103 đơn vị', symbol: '◔' },
      { title: 'Đơn vị hoàn thành', value: '0', note: 'Kích đỡ trên 03 chỉ tiêu', symbol: '✓' },
      { title: 'Đang triển khai', value: '114', note: 'Đơn vị đã phát sinh tiến độ', symbol: '↗' },
      { title: 'Chưa triển khai', value: '298', note: 'Chưa phát sinh tiến độ', symbol: '◌' }
    ];

    const progressData = [
      { label: 'Chuyển sinh hoạt chính thức', value: 2.9 },
      { label: 'Chuyển sinh hoạt tạm thời', value: 1.4 },
      { label: 'Nhận xét nội trú', value: 1.4 },
      { label: 'Thủ tục ngắn', value: 32.3 }
    ];

    const statsData = [
      { label: 'Hồ sơ đã tiếp nhận', value: '1.203' },
      { label: 'Hồ sơ đã xử lý', value: '801' },
      { label: 'Tỉ lệ hoàn thành', value: '67%' },
      { label: 'Đơn vị chậm', value: '19' }
    ];

    const rows = [
      { unit: 'Đảng bộ xã Kim Sơn', procedure: 'Chuyển sinh hoạt', progress: '57,5%', status: 'good', statusText: 'Đang triển khai' },
      { unit: 'Đảng bộ xã Phú Lương', procedure: 'Chuyển sinh hoạt', progress: '52,2%', status: 'warn', statusText: 'Cần theo dõi' },
      { unit: 'Đảng bộ xã Hưng Phúc', procedure: 'Nhận xét nội trú', progress: '50,7%', status: 'good', statusText: 'Đang triển khai' },
      { unit: 'Đảng bộ xã Bảo Yên', procedure: 'Thủ tục ngắn', progress: '83,1%', status: 'gray', statusText: 'Ổn định' }
    ];

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = navItems.map(item => `
        <button type="button" class="${item.active ? 'active' : ''}" data-id="${item.id}">
          <span class="ico">${item.id === 'overview' ? '▣' : item.id === 'procedure' ? '▤' : '◫'}</span>
          <span>${item.label}</span>
          <span class="count">${item.count}</span>
        </button>
      `).join('');

      nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          navItems.forEach(x => x.active = (x.id === btn.dataset.id));
          renderNav();
          const id = btn.dataset.id;
          document.getElementById('crumbName').textContent = id === 'overview' ? 'Tổng quan' : id === 'procedure' ? 'Thủ tục hành chính' : 'Hồ sơ';
          document.getElementById('pageTitle').textContent = id === 'overview' ? 'Tổng hợp 04 thủ tục hành chính' : id === 'procedure' ? 'Chi tiết thủ tục hành chính' : 'Danh sách hồ sơ';
          document.getElementById('subtitleText').textContent = id === 'overview'
            ? 'Tình hình thực hiện so với kế hoạch đầu năm'
            : id === 'procedure'
              ? 'Theo dõi từng loại thủ tục và tiến độ xử lý'
              : 'Hồ sơ đang được cập nhật theo từng đơn vị';
        });
      });
    }

    function renderCards() {
      const cards = document.getElementById('cards');
      cards.innerHTML = cardsData.map(card => `
        <div class="card">
          <div class="card-top"><span>${card.title}</span><span class="card-symbol">${card.symbol}</span></div>
          <div class="card-value">${card.value}</div>
          <div class="card-foot">${card.note}</div>
        </div>
      `).join('');
    }

    function renderProgress() {
      const list = document.getElementById('progressList');
      const total = progressData.length;
      list.innerHTML = progressData.map((item, index) => `
        <div class="bar-row" style="${index === total - 1 ? 'opacity: 1' : ''}">
          <div class="bar-name">${item.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(item.value, 100)}%"></div></div>
          <div class="bar-val">${item.value}%</div>
        </div>
      `).join('');
      document.getElementById('procedureCount').textContent = `${progressData.length * 26} đơn vị`;
    }

    function renderStats() {
      const el = document.getElementById('statsGrid');
      el.innerHTML = statsData.map(item => `
        <div class="mini">
          <div class="k">${item.label}</div>
          <div class="v">${item.value}</div>
        </div>
      `).join('');
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = rows.map(row => `
        <tr>
          <td>${row.unit}</td>
          <td>${row.procedure}</td>
          <td>${row.progress}</td>
          <td><span class="pill ${row.status}">${row.statusText}</span></td>
        </tr>
      `).join('');
    }

    function updateClock() {
      const now = new Date();
      const date = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      document.getElementById('dateChip').textContent = date;
      document.getElementById('timeChip').textContent = time;
    }

    document.getElementById('chatBtn').addEventListener('click', () => {
      alert('Tính năng hỏi AI đang được phát triển tiếp theo.');
    });

    renderNav();
    renderCards();
    renderProgress();
    renderStats();
    renderTable();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
