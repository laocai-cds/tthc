name: Gom tin địa phương

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-pool
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gom tin RSS thành news/pool.json
        run: python scripts/build_pool.py
      - name: Ghi lại nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/pool.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Cập nhật tin địa phương"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
